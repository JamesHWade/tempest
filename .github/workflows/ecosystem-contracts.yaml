on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

name: ecosystem-contracts.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-contracts:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    name: Ecosystem contracts
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
      TESTTHAT_CPUS: "1"
      TESTTHAT_PARALLEL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # DESCRIPTION's Remotes track each maintained package's main branch, so
      # this installs the current ecosystem heads.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Record ecosystem revisions
        run: |
          rows <- vapply(
            c("deputy", "dsprrr", "graft", "shinymcp"),
            function(package) {
              sha <- packageDescription(package)$RemoteSha
              if (is.null(sha) || !grepl("^[0-9a-f]{40}$", sha)) {
                stop(package, " was not installed from GitHub")
              }
              sprintf("| `%s` | `%s` |", package, sha)
            },
            character(1)
          )
          cat(
            "## Ecosystem revisions",
            "",
            "| Package | Installed `main` |",
            "| --- | --- |",
            rows,
            sep = "\n",
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            append = TRUE
          )
        shell: Rscript {0}

      - name: Run deterministic cross-repository contracts
        run: devtools::test(filter = "^(ecosystem-contracts|deputy-adapter|costorm-deputy|tools)$")
        shell: Rscript {0}
