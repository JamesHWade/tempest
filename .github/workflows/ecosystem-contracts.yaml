on:
  pull_request:
  workflow_dispatch:

name: ecosystem-contracts.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-contracts:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::remotes
          needs: check

      - name: Install maintained ecosystem remotes
        run: |
          remotes <- trimws(strsplit(
            read.dcf("DESCRIPTION", fields = "Remotes")[[1]],
            ",",
            fixed = TRUE
          )[[1]])
          ecosystem <- remotes[grepl(
            "^JamesHWade/(deputy|dsprrr|graft)$",
            remotes
          )]
          if (length(ecosystem) != 3L) {
            stop("DESCRIPTION must track Deputy, dsprrr, and Graft remotes")
          }
          remotes::install_github(
            ecosystem,
            dependencies = FALSE,
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Run deterministic cross-repository contracts
        run: devtools::test(filter = "^ecosystem-contracts$")
        shell: Rscript {0}
