on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

name: ecosystem-contracts.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-contracts:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    name: Pinned ecosystem contracts
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::remotes
          needs: check

      - name: Install pinned ecosystem remotes
        run: |
          remotes <- trimws(strsplit(
            read.dcf("DESCRIPTION", fields = "Remotes")[[1]],
            ",",
            fixed = TRUE
          )[[1]])
          ecosystem <- remotes[grepl(
            "^JamesHWade/(deputy|dsprrr|graft)(@[^[:space:]]+)?$",
            remotes
          )]
          if (
            length(ecosystem) != 3L ||
            any(!grepl(
              "^JamesHWade/(deputy|dsprrr|graft)@[0-9a-f]{40}$",
              ecosystem
            )) ||
            length(unique(sub("@.*$", "", ecosystem))) != 3L
          ) {
            stop(
              "DESCRIPTION must pin Deputy, dsprrr, and Graft to full SHAs"
            )
          }
          remotes::install_github(
            ecosystem,
            dependencies = FALSE,
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Run deterministic cross-repository contracts
        run: devtools::test(filter = "^ecosystem-contracts$")
        shell: Rscript {0}

  floating-heads:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Floating ecosystem heads
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::remotes
          needs: check

      - name: Record floating ecosystem revisions
        id: floating_heads
        run: |
          set -euo pipefail

          echo '## Floating ecosystem heads' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'These revisions are installed by this scheduled or manual run.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Package | DESCRIPTION pin | Current `main` | Status |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"

          for package in deputy dsprrr graft; do
            pinned=$(sed -nE \
              "s/^[[:space:]]*JamesHWade\\/${package}@([0-9a-f]{40}),?[[:space:]]*$/\\1/p" \
              DESCRIPTION
            )
            if [[ -z "$pinned" ]]; then
              echo "Could not find a full SHA pin for $package" >&2
              exit 1
            fi

            head=$(git ls-remote \
              "https://github.com/JamesHWade/${package}.git" \
              refs/heads/main | awk 'NR == 1 { print $1 }')
            if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve the current main SHA for $package" >&2
              exit 1
            fi

            status=drift
            if [[ "$pinned" == "$head" ]]; then
              status=current
            else
              echo "::warning::${package} current main ${head} differs from pinned ${pinned}"
            fi
            printf '| `%s` | `%s` | `%s` | `%s` |\n' \
              "$package" "$pinned" "$head" "$status" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "${package}_sha=${head}" >> "$GITHUB_OUTPUT"
          done

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'A `drift` row means that the pinned PR contract and current ecosystem head differ. The floating tests below are the compatibility signal; update DESCRIPTION only after validating a new exact SHA.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install current ecosystem heads
        env:
          DEPUTY_SHA: ${{ steps.floating_heads.outputs.deputy_sha }}
          DSPRRR_SHA: ${{ steps.floating_heads.outputs.dsprrr_sha }}
          GRAFT_SHA: ${{ steps.floating_heads.outputs.graft_sha }}
        run: |
          remotes::install_github(
            c(
              sprintf("JamesHWade/deputy@%s", Sys.getenv("DEPUTY_SHA")),
              sprintf("JamesHWade/dsprrr@%s", Sys.getenv("DSPRRR_SHA")),
              sprintf("JamesHWade/graft@%s", Sys.getenv("GRAFT_SHA"))
            ),
            dependencies = FALSE,
            upgrade = "always"
          )
        shell: Rscript {0}

      - name: Run contracts against current ecosystem heads
        run: devtools::test(filter = "^ecosystem-contracts$")
        shell: Rscript {0}

      - name: Explain floating-head failures
        if: always()
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'If this job fails while Pinned ecosystem contracts passes, inspect the failing contract against the revisions in the table and update the pinned SHA only with a validated compatibility change.' >> "$GITHUB_STEP_SUMMARY"
