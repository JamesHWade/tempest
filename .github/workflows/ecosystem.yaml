name: Ecosystem composition

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    name: ecosystem (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.dependencies == 'upstream' }}
    strategy:
      fail-fast: false
      matrix:
        dependencies: [supported, upstream]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      TESTTHAT_CPUS: "1"
      TESTTHAT_PARALLEL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install current upstream ecosystem
        if: matrix.dependencies == 'upstream'
        shell: Rscript {0}
        run: |
          pak::pkg_install(c("JamesHWade/deputy", "JamesHWade/dsprrr",
                             "JamesHWade/graft", "JamesHWade/shinymcp"),
                           upgrade = TRUE)
      - name: Record the actual dependency revisions
        shell: Rscript {0}
        run: |
          for (package in c("ellmer", "deputy", "dsprrr", "graft", "shinymcp")) {
            description <- packageDescription(package)
            revision <- description$RemoteSha
            if (is.null(revision)) revision <- description$Repository
            if (is.null(revision)) revision <- "unrecorded"
            cat(package, description$Version, revision, "\n")
          }
      - name: Run the complete offline composition
        shell: Rscript {0}
        run: |
          testthat::test_local(
            filter = "^(tools|deputy-adapter|costorm-deputy|ecosystem-contracts|mcp-app|ecosystem-demo)$"
          )
